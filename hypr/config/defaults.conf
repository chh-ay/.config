# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                     Defaults Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

$filemanager = thunar
$applauncher = rofi -show combi -modi window,run,combi -combi-modi window,run
$terminal = ghostty
$idlehandler = swayidle -w timeout 300 'swaylock -f -c 000000' before-sleep 'swaylock -f -c 000000'
$capturing = grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied to clipboard"
$capturing_edit = grim -g "$(slurp)" - | satty --filename - --fullscreen --initial-tool arrow --copy-command "wl-copy" --actions-on-right-click save-to-clipboard
$clipboard = kitty --class clipse -e 'clipse'
